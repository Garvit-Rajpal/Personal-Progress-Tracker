version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ppt_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: personal_progress_assistant
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_progress_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: ppt_server
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/personal_progress_assistant?schema=public
      - JWT_SECRET=super_secret_jwt_key_123 # Replace with a strong key or your actual .env value
      - JWT_REFRESH_SECRET=super_secret_refresh_key_456 # Replace with a strong key or your actual .env value
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./server:/app
      - /app/node_modules # Prevents host node_modules from overriding container node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate && npx prisma migrate dev --name init && npx nodemon src/index.ts"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ppt_client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules # Prevents host node_modules from overriding container node_modules
      - /app/.next      # Ensures Next.js build cache is preserved inside container
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - server

volumes:
  postgres_data:
